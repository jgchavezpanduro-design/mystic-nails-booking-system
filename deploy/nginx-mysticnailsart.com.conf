map $http_accept $mn_want_md {
    default 0;
    "~*text/markdown" 1;
}

map $http_accept $mn_404_target {
    default /404.html;
    "~*text/markdown" /md/404.md;
}

server {
    listen 443 ssl;
    server_name www.mysticnailsart.com;

    ssl_certificate /etc/letsencrypt/live/mysticnailsart.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mysticnailsart.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://mysticnailsart.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mysticnailsart.com;
    root /var/www/mysticnailsart.com;
    index index.html;

    error_page 404 =404 $mn_404_target;

    location ~* \.(?:webp|jpg|jpeg|png|gif|svg|ico|css|js|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Vary "Accept, Accept-Encoding" always;
    }

    location = /md/404.md {
        internal;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        default_type "text/markdown; charset=utf-8";
        add_header Vary "Accept, Accept-Encoding" always;
    }

    location /md/ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        default_type "text/markdown; charset=utf-8";
        add_header Vary "Accept, Accept-Encoding" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://www.googletagmanager.com https://*.doubleclick.net https://*.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://www.google-analytics.com https://*.google.com https://*.doubleclick.net https://www.googletagmanager.com; frame-src https://www.google.com https://*.doubleclick.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Vary "Accept, Accept-Encoding" always;

        if ($mn_want_md) {
            rewrite ^/guia/([^/]+)/?$ /md/guia/$1.md last;
            rewrite ^/$ /md/index.md last;
            rewrite ^/([^/]+)/?$ /md/$1.md last;
        }

        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary off;
    gzip_types text/css application/javascript image/svg+xml application/json text/markdown;
    gzip_min_length 1024;

    ssl_certificate /etc/letsencrypt/live/mysticnailsart.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mysticnailsart.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name mysticnailsart.com www.mysticnailsart.com;
    return 301 https://mysticnailsart.com$request_uri;
}
